[package]
name = "toolbox-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Windows-first, local desktop workspace for open office engines"

[[bin]]
name = "toolbox"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
